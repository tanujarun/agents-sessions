name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install .[tui,dev] into .venv
        run: make dev
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Engine tests (bare Python, no Textual)
        run: make test
      - name: TUI tests
        run: make test-tui

  # The Windows port is planned, not done: this job shows how far the engine
  # is from it and must not fail the build.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Engine tests
        run: python -m unittest discover -s tests -v
